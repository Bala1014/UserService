services:
  postgres:
    image: postgres:16-alpine
    container_name: userservice-postgres
    environment:
      POSTGRES_DB: userservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userservice"]
      interval: 5s
      timeout: 5s
      retries: 5

  userservice:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__UserDatabase: "Host=postgres;Port=5432;Database=userservice;Username=postgres;Password=postgres"
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
      # Local dev uses a symmetric key so tokens survive restarts and RaceService can
      # validate them without discovery. Production should set Jwt__Algorithm=RS256 and
      # supply Jwt__PrivateKeyPem instead.
      Jwt__Algorithm: HS256
      Jwt__SigningKey: "local-development-only-signing-key-change-me-32-bytes-minimum"
      Cors__AllowedOrigins__0: "http://localhost:3000"

volumes:
  user_pgdata:
